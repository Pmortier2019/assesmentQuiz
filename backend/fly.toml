app = "app-white-shadow-5362"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "railway"
  # Base URL for links in transactional emails (verification, password reset).
  # Must be the live frontend domain — the old *.vercel.app alias is gone.
  FRONTEND_URL = "https://www.ready-to-ace.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  http_response_timeout = 180000

  [[http_service.checks]]
    # Start probing early and often so the green machine flips healthy the moment
    # the app is listening. /api/health is a trivial static 200 (no DB), so a
    # short grace period is safe: failed probes before boot just retry.
    grace_period = "20s"
    interval = "10s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[deploy]
  strategy = "bluegreen"
  # Spring Boot cold-start on a shared-CPU 512MB machine regularly needs well
  # over 90s. The old 120s wait left almost no room for health checks to pass
  # after the 90s grace period, so green never went healthy and every deploy
  # rolled back (see #38). 300s gives the app ample time to boot and pass.
  wait_timeout = "300s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
