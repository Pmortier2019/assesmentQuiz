app = "app-white-shadow-5362"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  SPRING_PROFILES_ACTIVE = "railway"
  # Base URL for links in transactional emails (verification, password reset).
  # Must be the live frontend domain — the old *.vercel.app alias is gone.
  FRONTEND_URL = "https://www.ready-to-ace.com"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  http_response_timeout = 180000

  [[http_service.checks]]
    grace_period = "90s"
    interval = "15s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[deploy]
  strategy = "bluegreen"
  wait_timeout = "120s"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
