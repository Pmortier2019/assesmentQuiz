# Staging profile — ephemeral H2, used only to validate the cross-site
# auth/cookie flow against a Vercel preview. No persistent data.
server.address=0.0.0.0
logging.level.com.assesspro=INFO

spring.datasource.url=jdbc:h2:mem:assesspro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

# Cookie attributes inherit from application.properties:
#   AUTH_COOKIE_SECURE=true, AUTH_COOKIE_SAME_SITE=None  → required cross-site.
