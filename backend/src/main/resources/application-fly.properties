server.address=0.0.0.0

# DATABASE_URL must be set as a Fly.io secret (jdbc:postgresql://... format).
# No fallback — app refuses to start without a real database.
spring.datasource.url=${DATABASE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

logging.level.com.assesspro=INFO

# ANTHROPIC_API_KEY must be set as a Fly.io secret.
# fly secrets set ANTHROPIC_API_KEY=sk-ant-...
