server.address=0.0.0.0

# DATABASE_URL is set by Fly.io as: postgres://user:pass@host:5432/dbname
# We rewrite it to the jdbc: format Spring Boot expects.
spring.datasource.url=${DATABASE_URL:jdbc:h2:mem:assesspro}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

logging.level.com.assesspro=INFO
