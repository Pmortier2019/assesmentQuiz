spring.application.name=assesspro-backend

# ── Database ─────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/assesspro
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ── Server ────────────────────────────────────────────────────────────────────
server.port=8080

# ── Jackson ───────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ── Logging ───────────────────────────────────────────────────────────────────
logging.level.com.assesspro=DEBUG
logging.level.org.hibernate.SQL=WARN

# ── CORS ──────────────────────────────────────────────────────────────────────
# Set CORS_ALLOWED_ORIGINS env variable in production, e.g.:
# CORS_ALLOWED_ORIGINS=https://your-app.vercel.app
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}

# ── Auth / tokens ─────────────────────────────────────────────────────────────
# Short-lived access token + long-lived refresh token (httpOnly cookie).
app.auth.access-token-ttl-minutes=${ACCESS_TOKEN_TTL_MINUTES:120}
app.auth.refresh-token-ttl-days=${REFRESH_TOKEN_TTL_DAYS:30}
# Cross-site (Vercel <-> Fly) requires SameSite=None; Secure in production.
app.auth.cookie-secure=${AUTH_COOKIE_SECURE:true}
app.auth.cookie-same-site=${AUTH_COOKIE_SAME_SITE:None}

# ── Sentry (error monitoring) ─────────────────────────────────────────────────
# DSN is empty unless SENTRY_DSN is set (production only), so Sentry stays
# disabled in local dev and tests. Backend lives in the same Sentry org as the
# frontend project (EU region).
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
# Errors matter more than traces; keep tracing low to protect the free-tier quota.
sentry.traces-sample-rate=0.1
# Never ship PII (emails, tokens) to Sentry.
sentry.send-default-pii=false
