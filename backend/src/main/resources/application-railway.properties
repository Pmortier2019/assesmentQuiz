server.address=0.0.0.0
logging.level.com.assesspro=INFO

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# Flyway — run migrations on startup, baseline existing DB on first run
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# HikariPool — tuned for Neon's free tier, which autosuspends compute after ~5
# min idle and drops idle server connections. Keeping idle connections alive (the
# old minimum-idle=1) made Hikari constantly reconnect — keeping Neon awake (eating
# the free compute budget) and, worse, handing requests a dead connection that
# stalled for the full connection-timeout (~20s) before failing over.
#
# minimum-idle=0  -> let the pool drain so Neon can suspend; reconnect on demand.
# validation-timeout / connection-timeout -> reject a dead/slow connection in
#   seconds and open a fresh one, instead of hanging ~20s on a stale one.
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
spring.datasource.hikari.initialization-fail-timeout=0

# Sentry — this profile is production, so tag events accordingly.
sentry.environment=production
