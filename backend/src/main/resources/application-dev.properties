# Dev profile — uses H2 in-memory DB, no PostgreSQL required.
# Run with: mvn spring-boot:run -Dspring-boot.run.profiles=dev

spring.datasource.url=jdbc:h2:mem:assesspro;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# H2 web console — http://localhost:8080/h2-console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local dev is same-site over http://localhost, so a Lax, non-secure cookie works
# (SameSite=None would require HTTPS).
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax
