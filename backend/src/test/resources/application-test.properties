# Test profile — H2 in-memory, schema generated from JPA entities.
# Kept deliberately independent of the Postgres-specific Flyway migrations so
# the suite runs anywhere without a database.

spring.datasource.url=jdbc:h2:mem:assesspro_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Schema comes from ddl-auto, not the Postgres migrations.
spring.flyway.enabled=false

# Secrets the context needs to start — dummy values, only used by tests.
JWT_SECRET=test-secret-test-secret-test-secret-test-secret-0123456789
LEMON_SQUEEZY_WEBHOOK_SECRET=test-webhook-secret

# Same-site over http in tests (no HTTPS), so a non-secure Lax cookie works.
app.auth.cookie-secure=false
app.auth.cookie-same-site=Lax

logging.level.com.assesspro=WARN
logging.level.org.hibernate.SQL=WARN
