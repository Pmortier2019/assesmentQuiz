version: 2

# Dependabot opent automatisch PR's om verouderde/kwetsbare dependencies bij te werken.
updates:
  # Frontend (npm, root)
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Bundel kleine updates in één PR i.p.v. tientallen losse.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major-bumps bevatten breaking changes en vereisen handmatige migratie
      # (bv. ESLint 10 vs. eslint-config-next). Bewust apart oppakken, niet automatisch.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Backend (Maven)
  - package-ecosystem: maven
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Major-bumps bevatten breaking changes en vereisen handmatige migratie
      # (bv. Spring Boot 4 + Jackson 3 package-rename). Bewust apart oppakken.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # De GitHub Actions in deze workflows zelf
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
