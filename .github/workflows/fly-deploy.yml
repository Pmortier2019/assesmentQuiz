name: Deploy backend to Fly.io

# Productie-deploy van de backend.
# Draait alleen als er iets in backend/** wijzigt op main.
# Flow: eerst bouwen & testen -> dan (met goedkeuring) deployen -> dan smoke-test.

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

# Nooit twee productie-deploys tegelijk.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - name: Make mvnw executable
        run: chmod +x mvnw
      - name: Build & test
        run: ./mvnw -B verify

  deploy:
    name: Deploy
    needs: test # deployt alleen als de tests groen zijn
    runs-on: ubuntu-latest
    # Koppelt aan de GitHub "production" environment.
    # Zet daar een required reviewer -> dan moet jij eerst op "Approve" klikken.
    environment:
      name: production
      url: https://app-white-shadow-5362.fly.dev
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Smoke test (health check)
        run: |
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /dev/null -w "%{http_code}" https://app-white-shadow-5362.fly.dev/api/health || true)
            echo "Poging $i: HTTP $code"
            if [ "$code" = "200" ]; then echo "Backend is gezond ✅"; exit 0; fi
            sleep 10
          done
          echo "Health check mislukt — backend reageert niet met 200 ❌"
          exit 1
