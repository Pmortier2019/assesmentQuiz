name: CI

# Draait bij elke Pull Request naar main/develop en bij elke push naar main/develop.
# Zolang deze checks niet groen zijn, mag een PR niet mergen (zie branch protection).
# develop = integratiebuffer: feature-PR's gaan hierheen, niet rechtstreeks naar main.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

# Annuleer oudere runs op dezelfde branch/PR — bespaart tijd en CI-minuten.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Placeholder zodat de build niet faalt op een ontbrekende env-var.
          NEXT_PUBLIC_API_URL: https://app-white-shadow-5362.fly.dev

  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Build & test
        run: ./mvnw -B verify
